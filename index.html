<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>License 管理後台</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0f1117; --bg2: #1a1d27; --bg3: #22263a;
    --border: #2e3347; --text: #e2e8f0; --muted: #8892a4;
    --purple: #7c6ff7; --purple-d: #6558e8; --purple-bg: #1e1b3a;
    --green: #34d399; --green-bg: #0d2e23;
    --red: #f87171; --red-bg: #2d1515;
    --amber: #fbbf24; --amber-bg: #2a1f06;
    --radius: 8px; --radius-lg: 12px;
  }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg); color: var(--text); min-height: 100vh; font-size: 14px; }
  #login-screen { display: flex; align-items: center; justify-content: center;
    min-height: 100vh; padding: 24px; }
  .login-card { background: var(--bg2); border: 1px solid var(--border);
    border-radius: var(--radius-lg); padding: 40px; width: 100%; max-width: 400px; }
  .login-card h1 { font-size: 22px; font-weight: 600; margin-bottom: 6px; }
  .login-card p { color: var(--muted); margin-bottom: 28px; }
  #app { display: none; min-height: 100vh; }
  .sidebar { width: 220px; position: fixed; top: 0; left: 0; height: 100vh;
    background: var(--bg2); border-right: 1px solid var(--border);
    padding: 24px 16px; display: flex; flex-direction: column; }
  .sidebar .logo { font-size: 16px; font-weight: 700; color: var(--purple);
    margin-bottom: 32px; padding-left: 4px; }
  .nav-item { display: flex; align-items: center; gap: 10px; padding: 10px 12px;
    border-radius: var(--radius); cursor: pointer; color: var(--muted);
    transition: all .15s; margin-bottom: 4px; }
  .nav-item:hover { background: var(--bg3); color: var(--text); }
  .nav-item.active { background: var(--purple-bg); color: var(--purple); }
  .sidebar-footer { margin-top: auto; }
  .admin-badge { background: var(--bg3); border-radius: var(--radius);
    padding: 10px 12px; font-size: 12px; color: var(--muted); margin-bottom: 12px; }
  .main { margin-left: 220px; padding: 32px; }
  .page-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 28px; }
  .page-title { font-size: 22px; font-weight: 600; }
  .page-sub { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 28px; }
  .stat-card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 20px; }
  .stat-label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .05em; margin-bottom: 8px; }
  .stat-val { font-size: 28px; font-weight: 700; }
  .stat-val.green { color: var(--green); } .stat-val.red { color: var(--red); } .stat-val.purple { color: var(--purple); }
  .table-card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; }
  .table-header { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
  .table-title { font-weight: 600; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; padding: 12px 20px; font-size: 12px; color: var(--muted);
    text-transform: uppercase; letter-spacing: .05em; border-bottom: 1px solid var(--border); font-weight: 500; }
  td { padding: 14px 20px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: var(--bg3); }
  .badge { display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px;
    border-radius: 99px; font-size: 12px; font-weight: 500; }
  .badge-green { background: var(--green-bg); color: var(--green); }
  .badge-red { background: var(--red-bg); color: var(--red); }
  .badge-amber { background: var(--amber-bg); color: var(--amber); }
  .btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px;
    border-radius: var(--radius); border: none; cursor: pointer; font-size: 13px; font-weight: 500; transition: all .15s; }
  .btn-primary { background: var(--purple); color: #fff; }
  .btn-primary:hover { background: var(--purple-d); }
  .btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); }
  .btn-ghost:hover { color: var(--text); }
  .btn-danger { background: var(--red-bg); color: var(--red); }
  .btn-sm { padding: 5px 10px; font-size: 12px; }
  .form-group { margin-bottom: 16px; }
  label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  input, select { width: 100%; padding: 9px 12px; background: var(--bg3);
    border: 1px solid var(--border); border-radius: var(--radius);
    color: var(--text); font-size: 14px; outline: none; transition: border .15s; }
  input:focus, select:focus { border-color: var(--purple); }
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.7);
    display: none; align-items: center; justify-content: center; z-index: 100; padding: 24px; }
  .modal-overlay.show { display: flex; }
  .modal { background: var(--bg2); border: 1px solid var(--border);
    border-radius: var(--radius-lg); padding: 28px; width: 100%; max-width: 480px; }
  .modal h2 { font-size: 18px; font-weight: 600; margin-bottom: 20px; }
  .modal-footer { display: flex; gap: 10px; justify-content: flex-end; margin-top: 24px; }
  .toast { position: fixed; bottom: 24px; right: 24px; padding: 12px 18px;
    border-radius: var(--radius); font-size: 13px; font-weight: 500;
    transform: translateY(80px); opacity: 0; transition: all .25s; z-index: 999; }
  .toast.show { transform: translateY(0); opacity: 1; }
  .toast.success { background: var(--green-bg); color: var(--green); border: 1px solid #1a5c43; }
  .toast.error { background: var(--red-bg); color: var(--red); border: 1px solid #5c2020; }
  .key-display { font-family: 'Courier New', monospace; background: var(--bg3);
    padding: 10px 14px; border-radius: var(--radius); font-size: 15px;
    letter-spacing: .1em; color: var(--purple); border: 1px solid var(--border); text-align: center; cursor: pointer; }
  .page { display: none; }
  .page.active { display: block; }
  .empty-state { text-align: center; padding: 48px 24px; color: var(--muted); }
</style>
</head>
<body>

<div id="login-screen">
  <div class="login-card">
    <h1>🔐 授權管理後台</h1>
    <p>請輸入管理員帳號登入</p>
    <div class="form-group">
      <label>Email</label>
      <input type="email" id="login-email" value="admin@example.com">
    </div>
    <div class="form-group">
      <label>密碼</label>
      <input type="password" id="login-password" value="admin1234"
        onkeydown="if(event.key==='Enter') doLogin()">
    </div>
    <div id="login-error" style="color:var(--red);font-size:13px;margin-bottom:12px;display:none"></div>
    <button class="btn btn-primary" style="width:100%;justify-content:center" onclick="doLogin()">登入</button>
  </div>
</div>

<div id="app">
  <div class="sidebar">
    <div class="logo">⚡ LicenseHub</div>
    <nav>
      <div class="nav-item active" onclick="showPage('dashboard')" id="nav-dashboard"><span>📊</span> 總覽</div>
      <div class="nav-item" onclick="showPage('customers')" id="nav-customers"><span>👥</span> 客戶管理</div>
      <div class="nav-item" onclick="showPage('licenses')" id="nav-licenses"><span>🔑</span> 授權管理</div>
      <div class="nav-item" onclick="showPage('logs')" id="nav-logs"><span>📋</span> 驗證記錄</div>
    </nav>
    <div class="sidebar-footer">
      <div class="admin-badge" id="admin-email-display">admin@example.com</div>
      <button class="btn btn-ghost" style="width:100%;justify-content:center" onclick="doLogout()">登出</button>
    </div>
  </div>

  <main class="main">
    <div class="page active" id="page-dashboard">
      <div class="page-header">
        <div><div class="page-title">總覽</div><div class="page-sub">授權系統運行狀態</div></div>
        <button class="btn btn-ghost btn-sm" onclick="loadDashboard()">↻ 重新整理</button>
      </div>
      <div class="stats-grid">
        <div class="stat-card"><div class="stat-label">總客戶數</div><div class="stat-val purple" id="stat-customers">—</div></div>
        <div class="stat-card"><div class="stat-label">有效授權</div><div class="stat-val green" id="stat-active">—</div></div>
        <div class="stat-card"><div class="stat-label">已停用授權</div><div class="stat-val red" id="stat-suspended">—</div></div>
      </div>
      <div class="table-card">
        <div class="table-header"><span class="table-title">最近驗證記錄</span></div>
        <table><thead><tr><th>License Key</th><th>Machine ID</th><th>結果</th><th>時間</th></tr></thead>
        <tbody id="recent-logs"></tbody></table>
      </div>
    </div>

    <div class="page" id="page-customers">
      <div class="page-header">
        <div><div class="page-title">客戶管理</div></div>
        <button class="btn btn-primary" onclick="openAddCustomer()">+ 新增客戶</button>
      </div>
      <div class="table-card">
        <table><thead><tr><th>名稱</th><th>Email</th><th>授權數</th><th>有效授權</th><th>建立時間</th><th>操作</th></tr></thead>
        <tbody id="customers-table"></tbody></table>
      </div>
    </div>

    <div class="page" id="page-licenses">
      <div class="page-header">
        <div><div class="page-title">授權管理</div></div>
        <button class="btn btn-primary" onclick="openAddLicense()">+ 新增授權</button>
      </div>
      <div class="table-card">
        <table><thead><tr><th>License Key</th><th>客戶</th><th>狀態</th><th>綁定裝置</th><th>最後驗證</th><th>到期日</th><th>操作</th></tr></thead>
        <tbody id="licenses-table"></tbody></table>
      </div>
    </div>

    <div class="page" id="page-logs">
      <div class="page-header">
        <div><div class="page-title">驗證記錄</div></div>
        <button class="btn btn-ghost btn-sm" onclick="loadLogs()">↻ 重新整理</button>
      </div>
      <div class="table-card">
        <table><thead><tr><th>License Key</th><th>Machine ID</th><th>結果</th><th>IP</th><th>時間</th></tr></thead>
        <tbody id="logs-table"></tbody></table>
      </div>
    </div>
  </main>
</div>

<!-- Modals -->
<div class="modal-overlay" id="modal-customer">
  <div class="modal">
    <h2>新增客戶</h2>
    <div class="form-group"><label>客戶名稱</label><input type="text" id="new-customer-name" placeholder="例：台北市立圖書館"></div>
    <div class="form-group"><label>Email</label><input type="email" id="new-customer-email"></div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal('modal-customer')">取消</button>
      <button class="btn btn-primary" onclick="addCustomer()">建立客戶</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modal-license">
  <div class="modal">
    <h2>新增授權</h2>
    <div class="form-group"><label>選擇客戶</label><select id="new-license-customer"></select></div>
    <div class="form-group"><label>備註（選填）</label><input type="text" id="new-license-note"></div>
    <div class="form-group"><label>到期日（選填）</label><input type="date" id="new-license-expires"></div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal('modal-license')">取消</button>
      <button class="btn btn-primary" onclick="addLicense()">產生授權碼</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modal-show-key">
  <div class="modal">
    <h2>🎉 授權碼已產生</h2>
    <p style="color:var(--muted);margin-bottom:16px;font-size:13px">點擊複製後提供給客戶，請妥善保存。</p>
    <div class="key-display" id="new-key-display" onclick="copyText(this.textContent.trim())">—</div>
    <p style="color:var(--muted);font-size:12px;margin-top:8px;text-align:center">點擊複製</p>
    <div class="modal-footer"><button class="btn btn-primary" onclick="closeModal('modal-show-key')">關閉</button></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ── 設定你的 Supabase Project URL ────────────────────────────────────────────
// 格式：https://[project-id].supabase.co/functions/v1
const FUNC_BASE = 'https://hacrjbofrqzljzysdheb.supabase.co/functions/v1';

let token = localStorage.getItem('license_token') || '';

async function api(method, func, pathSuffix = '', body) {
    const url = `${FUNC_BASE}/${func}${pathSuffix}`;
    const res = await fetch(url, {
        method,
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
        body: body ? JSON.stringify(body) : undefined
    });
    if (res.status === 401) { doLogout(); return null; }
    return { ok: res.ok, status: res.status, data: await res.json() };
}

// ── Auth ─────────────────────────────────────────────────────────────────────
async function doLogin() {
    const email = document.getElementById('login-email').value;
    const password = document.getElementById('login-password').value;
    const errEl = document.getElementById('login-error');
    try {
        const res = await fetch(`${FUNC_BASE}/auth?action=login`, {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password })
        });
        const data = await res.json();
        if (!res.ok) { errEl.textContent = data.error; errEl.style.display = 'block'; return; }
        token = data.token;
        localStorage.setItem('license_token', token);
        errEl.style.display = 'none';
        document.getElementById('admin-email-display').textContent = data.email;
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('app').style.display = 'block';
        loadDashboard();
    } catch(e) {
        errEl.textContent = '無法連接到 API，請確認 Supabase Project ID 已設定正確';
        errEl.style.display = 'block';
    }
}

function doLogout() {
    localStorage.removeItem('license_token');
    token = '';
    document.getElementById('app').style.display = 'none';
    document.getElementById('login-screen').style.display = 'flex';
}

// ── Navigation ────────────────────────────────────────────────────────────────
function showPage(page) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    document.getElementById(`page-${page}`).classList.add('active');
    document.getElementById(`nav-${page}`).classList.add('active');
    if (page === 'dashboard') loadDashboard();
    if (page === 'customers') loadCustomers();
    if (page === 'licenses')  loadLicenses();
    if (page === 'logs')      loadLogs();
}

// ── Dashboard ─────────────────────────────────────────────────────────────────
async function loadDashboard() {
    const [custR, statsR] = await Promise.all([
        api('GET', 'customers'),
        api('GET', 'licenses', '/stats/summary')
    ]);
    if (custR) document.getElementById('stat-customers').textContent = custR.data.length;
    if (statsR && statsR.ok) {
        document.getElementById('stat-active').textContent    = statsR.data.active;
        document.getElementById('stat-suspended').textContent = statsR.data.suspended;
    }
    const licR = await api('GET', 'licenses');
    if (licR && licR.ok) {
        const allLogs = [];
        for (const lic of (licR.data || []).slice(0, 5)) {
            const r = await api('GET', 'licenses', `/${lic.id}/logs`);
            if (r?.ok) allLogs.push(...r.data);
        }
        allLogs.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
        renderLogs(document.getElementById('recent-logs'), allLogs.slice(0, 10));
    }
}

function renderLogs(tbody, logs) {
    if (!logs.length) { tbody.innerHTML = `<tr><td colspan="5"><div class="empty-state">尚無驗證記錄</div></td></tr>`; return; }
    tbody.innerHTML = logs.map(l => `<tr>
        <td style="font-family:monospace;color:var(--purple);font-size:12px">${l.license_key}</td>
        <td style="color:var(--muted);font-size:11px">${l.machine_id ? l.machine_id.slice(0,16)+'…' : '—'}</td>
        <td>${resultBadge(l.result)}</td>
        <td style="color:var(--muted);font-size:12px">${formatDate(l.created_at)}</td>
    </tr>`).join('');
}

// ── Customers ─────────────────────────────────────────────────────────────────
async function loadCustomers() {
    const r = await api('GET', 'customers');
    if (!r?.ok) return;
    const tbody = document.getElementById('customers-table');
    if (!r.data.length) { tbody.innerHTML = `<tr><td colspan="6"><div class="empty-state">尚無客戶</div></td></tr>`; return; }
    tbody.innerHTML = r.data.map(c => `<tr>
        <td style="font-weight:500">${esc(c.name)}</td>
        <td style="color:var(--muted)">${esc(c.email||'')}</td>
        <td>${c.license_count||0}</td>
        <td><span class="badge badge-green">${c.active_count||0} 有效</span></td>
        <td style="color:var(--muted);font-size:12px">${formatDate(c.created_at)}</td>
        <td><button class="btn btn-danger btn-sm" onclick="deleteCustomer('${c.id}','${esc(c.name)}')">刪除</button></td>
    </tr>`).join('');
}

function openAddCustomer() {
    document.getElementById('new-customer-name').value = '';
    document.getElementById('new-customer-email').value = '';
    document.getElementById('modal-customer').classList.add('show');
}

async function addCustomer() {
    const name = document.getElementById('new-customer-name').value.trim();
    const email = document.getElementById('new-customer-email').value.trim();
    if (!name || !email) { toast('請填寫所有欄位', 'error'); return; }
    const r = await api('POST', 'customers', '', { name, email });
    if (!r?.ok) { toast(r?.data?.error || '新增失敗', 'error'); return; }
    closeModal('modal-customer'); toast('客戶已新增', 'success'); loadCustomers();
}

async function deleteCustomer(id, name) {
    if (!confirm(`確定刪除客戶「${name}」？`)) return;
    await api('DELETE', 'customers', `/${id}`);
    toast('客戶已刪除', 'success'); loadCustomers();
}

// ── Licenses ──────────────────────────────────────────────────────────────────
async function loadLicenses() {
    const r = await api('GET', 'licenses');
    if (!r?.ok) return;
    const tbody = document.getElementById('licenses-table');
    if (!r.data.length) { tbody.innerHTML = `<tr><td colspan="7"><div class="empty-state">尚無授權</div></td></tr>`; return; }
    tbody.innerHTML = r.data.map(l => `<tr>
        <td><span style="font-family:monospace;font-size:12px;color:var(--purple);cursor:pointer"
            onclick="copyText('${l.license_key}')" title="點擊複製">${l.license_key}</span></td>
        <td><div style="font-weight:500">${esc(l.customer_name||'')}</div>
            <div style="color:var(--muted);font-size:12px">${esc(l.customer_email||'')}</div></td>
        <td>${statusBadge(l.status)}</td>
        <td style="font-size:11px;color:var(--muted)">
            ${l.activated_machine_id
                ? `${l.activated_machine_id.slice(0,12)}… <button class="btn btn-ghost btn-sm" style="font-size:10px;padding:2px 6px" onclick="unbind('${l.id}')">解綁</button>`
                : '<span style="opacity:.4">未啟用</span>'}
        </td>
        <td style="color:var(--muted);font-size:12px">${l.last_validated_at ? formatDate(l.last_validated_at) : '—'}</td>
        <td style="color:var(--muted);font-size:12px">${l.expires_at ? formatDate(l.expires_at) : '永久'}</td>
        <td style="white-space:nowrap">
            ${l.status === 'active'
                ? `<button class="btn btn-danger btn-sm" onclick="setStatus('${l.id}','suspended')">停用</button>`
                : `<button class="btn btn-sm" style="background:var(--green-bg);color:var(--green)" onclick="setStatus('${l.id}','active')">恢復</button>`}
            <button class="btn btn-danger btn-sm" style="margin-left:4px" onclick="deleteLicense('${l.id}')">刪</button>
        </td>
    </tr>`).join('');
}

async function openAddLicense() {
    const r = await api('GET', 'customers');
    if (!r?.data?.length) { toast('請先新增客戶', 'error'); showPage('customers'); return; }
    document.getElementById('new-license-customer').innerHTML =
        r.data.map(c => `<option value="${c.id}">${esc(c.name)} (${esc(c.email||'')})</option>`).join('');
    document.getElementById('new-license-note').value = '';
    document.getElementById('new-license-expires').value = '';
    document.getElementById('modal-license').classList.add('show');
}

async function addLicense() {
    const customer_id = document.getElementById('new-license-customer').value;
    const note = document.getElementById('new-license-note').value.trim();
    const expires_at = document.getElementById('new-license-expires').value;
    const r = await api('POST', 'licenses', '', { customer_id, note, expires_at: expires_at ? expires_at + 'T23:59:59Z' : null });
    if (!r?.ok) { toast(r?.data?.error || '新增失敗', 'error'); return; }
    closeModal('modal-license');
    document.getElementById('new-key-display').textContent = r.data.license_key;
    document.getElementById('modal-show-key').classList.add('show');
    loadLicenses();
}

async function setStatus(id, status) {
    await api('PATCH', 'licenses', `/${id}/status`, { status });
    toast(status === 'active' ? '授權已恢復' : '授權已停用', 'success'); loadLicenses();
}

async function deleteLicense(id) {
    if (!confirm('確定刪除此授權？')) return;
    await api('DELETE', 'licenses', `/${id}`);
    toast('授權已刪除', 'success'); loadLicenses();
}

async function unbind(id) {
    if (!confirm('解除綁定後此授權可在其他機器使用，確定嗎？')) return;
    await api('PATCH', 'licenses', `/${id}/unbind`);
    toast('裝置綁定已解除', 'success'); loadLicenses();
}

// ── Logs ──────────────────────────────────────────────────────────────────────
async function loadLogs() {
    const licR = await api('GET', 'licenses');
    if (!licR?.ok) return;
    const allLogs = [];
    for (const lic of licR.data) {
        const r = await api('GET', 'licenses', `/${lic.id}/logs`);
        if (r?.ok) allLogs.push(...r.data);
    }
    allLogs.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
    const tbody = document.getElementById('logs-table');
    if (!allLogs.length) { tbody.innerHTML = `<tr><td colspan="5"><div class="empty-state">尚無記錄</div></td></tr>`; return; }
    tbody.innerHTML = allLogs.slice(0, 100).map(l => `<tr>
        <td style="font-family:monospace;font-size:12px;color:var(--purple)">${l.license_key}</td>
        <td style="font-size:11px;color:var(--muted)">${l.machine_id ? l.machine_id.slice(0,16)+'…' : '—'}</td>
        <td>${resultBadge(l.result)}</td>
        <td style="color:var(--muted)">${l.ip||'—'}</td>
        <td style="color:var(--muted);font-size:12px">${formatDate(l.created_at)}</td>
    </tr>`).join('');
}

// ── Utils ──────────────────────────────────────────────────────────────────────
function statusBadge(s) {
    if (s === 'active') return '<span class="badge badge-green">● 有效</span>';
    return '<span class="badge badge-red">● 停用</span>';
}
function resultBadge(r) {
    const map = { success: ['badge-green','✓ 成功'], invalid_key: ['badge-red','✗ 無效碼'],
        suspended: ['badge-red','✗ 已停用'], expired: ['badge-amber','✗ 已到期'],
        machine_mismatch: ['badge-red','✗ 裝置不符'] };
    const [cls, label] = map[r] || ['badge-amber', r];
    return `<span class="badge ${cls}">${label}</span>`;
}
function formatDate(d) {
    if (!d) return '—';
    return new Date(d).toLocaleString('zh-TW', { year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit' });
}
function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function closeModal(id) { document.getElementById(id).classList.remove('show'); }
function copyText(text) {
    if (navigator.clipboard?.writeText) {
        navigator.clipboard.writeText(text).then(() => toast('已複製', 'success'));
    } else {
        const el = Object.assign(document.createElement('textarea'), { value: text, style: 'position:fixed;opacity:0' });
        document.body.appendChild(el); el.select(); document.execCommand('copy');
        document.body.removeChild(el); toast('已複製', 'success');
    }
}
let toastTimer;
function toast(msg, type = 'success') {
    const el = document.getElementById('toast');
    el.textContent = msg; el.className = `toast ${type} show`;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 2800);
}
document.querySelectorAll('.modal-overlay').forEach(o => {
    o.addEventListener('click', e => { if (e.target === o) o.classList.remove('show'); });
});
(async function autoLogin() {
    if (!token) return;
    try {
        const res = await fetch(`${FUNC_BASE}/auth?action=me`, { headers: { Authorization: `Bearer ${token}` } });
        if (res.ok) {
            const data = await res.json();
            document.getElementById('admin-email-display').textContent = data.email;
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('app').style.display = 'block';
            loadDashboard();
        } else { localStorage.removeItem('license_token'); token = ''; }
    } catch {}
})();
</script>
