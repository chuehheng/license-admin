<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>License 管理後台</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0f1117; --bg2: #1a1d27; --bg3: #22263a;
    --border: #2e3347; --text: #e2e8f0; --muted: #8892a4;
    --purple: #7c6ff7; --purple-d: #6558e8; --purple-bg: #1e1b3a;
    --green: #34d399; --green-bg: #0d2e23;
    --red: #f87171; --red-bg: #2d1515;
    --amber: #fbbf24; --amber-bg: #2a1f06;
    --radius: 8px; --radius-lg: 12px;
  }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg); color: var(--text); min-height: 100vh; font-size: 14px; }
  #login-screen { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
  .login-card { background: var(--bg2); border: 1px solid var(--border); padding: 32px; border-radius: var(--radius-lg); width: 100%; max-width: 400px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.3); }
  .login-card h2 { margin-bottom: 24px; font-size: 24px; font-weight: 600; text-align: center; }
  
  #app { display: none; min-height: 100vh; }
  header { background: var(--bg2); border-bottom: 1px solid var(--border); padding: 0 24px; height: 64px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 10; }
  .logo { font-size: 18px; font-weight: 700; color: var(--purple); display: flex; align-items: center; gap: 8px; }
  .nav-links { display: flex; gap: 4px; height: 100%; }
  .nav-btn { background: none; border: none; color: var(--muted); padding: 0 16px; font-size: 14px; cursor: pointer; display: flex; align-items: center; gap: 8px; height: 100%; border-bottom: 2px solid transparent; transition: all 0.2s; }
  .nav-btn:hover { color: var(--text); }
  .nav-btn.active { color: var(--purple); border-bottom-color: var(--purple); background: rgba(124,111,247,0.04); }
  .user-menu { display: flex; align-items: center; gap: 16px; }
  .user-email { color: var(--muted); font-size: 13px; }
  
  .container { max-width: 1200px; margin: 0 auto; padding: 32px 24px; }
  .view-panel { display: none; animation: fadeIn 0.2s ease-out; }
  .view-panel.active { display: block; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
  
  .page-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; }
  .page-title { font-size: 20px; font-weight: 600; }
  
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; background: var(--purple); color: #fff; border: none; padding: 8px 16px; border-radius: var(--radius); font-size: 13px; font-weight: 500; cursor: pointer; transition: background 0.2s; text-decoration: none; }
  .btn:hover { background: var(--purple-d); }
  .btn-secondary { background: var(--bg3); color: var(--text); border: 1px solid var(--border); }
  .btn-secondary:hover { background: var(--border); }
  .btn-danger { background: var(--red-bg); color: var(--red); border: 1px solid rgba(248,113,113,0.2); }
  .btn-danger:hover { background: rgba(248,113,113,0.2); }
  .btn-sm { padding: 4px 10px; font-size: 12px; border-radius: 6px; }
  
  .form-group { margin-bottom: 16px; }
  .form-group label { display: block; margin-bottom: 6px; color: var(--muted); font-size: 13px; }
  .form-control { width: 100%; background: var(--bg3); border: 1px solid var(--border); padding: 10px 14px; border-radius: var(--radius); color: var(--text); font-size: 14px; transition: border 0.2s; }
  .form-control:focus { outline: none; border-color: var(--purple); }
  
  .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin-bottom: 32px; }
  .stat-card { background: var(--bg2); border: 1px solid var(--border); padding: 20px; border-radius: var(--radius-lg); }
  .stat-label { color: var(--muted); font-size: 13px; margin-bottom: 6px; }
  .stat-value { font-size: 28px; font-weight: 700; }
  .stat-value.green { color: var(--green); }
  .stat-value.amber { color: var(--amber); }
  
  .card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; margin-bottom: 24px; }
  .table-responsive { width: 100%; overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; text-align: left; font-size: 13px; }
  th { background: rgba(255,255,255,0.02); color: var(--muted); font-weight: 500; padding: 12px 16px; border-bottom: 1px solid var(--border); }
  td { padding: 14px 16px; border-bottom: 1px solid var(--border); color: var(--text); vertical-align: middle; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: rgba(255,255,255,0.01); }
  
  .badge { display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 4px; font-size: 12px; font-weight: 500; }
  .badge-active { background: var(--green-bg); color: var(--green); }
  .badge-suspended { background: var(--red-bg); color: var(--red); }
  
  .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.2s; z-index: 100; padding: 20px; }
  .modal-overlay.show { opacity: 1; pointer-events: auto; }
  .modal { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius-lg); width: 100%; max-width: 500px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5); transform: translateY(10px); transition: transform 0.2s; overflow: hidden; }
  .modal-overlay.show .modal { transform: translateY(0); }
  .modal-header { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
  .modal-title { font-size: 16px; font-weight: 600; }
  .modal-close { background: none; border: none; color: var(--muted); font-size: 20px; cursor: pointer; }
  .modal-body { padding: 20px; max-height: 70vh; overflow-y: auto; }
  .modal-footer { padding: 14px 20px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 10px; background: rgba(0,0,0,0.05); }
  
  .code-block { background: var(--bg3); border: 1px solid var(--border); padding: 10px 14px; border-radius: var(--radius); font-family: monospace; font-size: 12px; color: var(--amber); word-break: break-all; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(100px); background: var(--purple); color: #fff; padding: 10px 20px; border-radius: var(--radius); box-shadow: 0 10px 15px -3px rgba(0,0,0,0.3); z-index: 1000; transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275); pointer-events: none; font-weight: 500; font-size: 13px; }
  .toast.show { transform: translateX(-50%) translateY(0); }
  .toast.danger { background: var(--red); }
  .flex-actions { display: flex; gap: 6px; }
  .empty { padding: 40px; text-align: center; color: var(--muted); }
</style>
</head>
<body>

<div id="login-screen">
  <div class="login-card">
    <h2>License Admin</h2>
    <form id="login-form">
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="login-email" class="form-control" required value="admin@twinkle.com">
      </div>
      <div class="form-group">
        <label>密碼</label>
        <input type="password" id="login-password" class="form-control" required>
      </div>
      <button type="submit" class="btn" style="width: 100%; margin-top: 8px;">登入</button>
    </form>
  </div>
</div>

<div id="app">
  <header>
    <div class="logo">✨ Twinkle License Center</div>
    <div class="nav-links">
      <button class="nav-btn active" onclick="switchView('dashboard')">儀表板</button>
      <button class="nav-btn" onclick="switchView('licenses')">授權金鑰</button>
      <button class="nav-btn" onclick="switchView('customers')">客戶管理</button>
    </div>
    <div class="user-menu">
      <span class="user-email" id="admin-email-display">admin@twinkle.com</span>
      <button class="btn btn-secondary btn-sm" onclick="openModal('modal-chpwd')">改密碼</button>
      <button class="btn btn-danger btn-sm" onclick="logout()">登出</button>
    </div>
  </header>

  <div class="container">
    <div id="view-dashboard" class="view-panel active">
      <div class="stats-grid">
        <div class="stat-card"><div class="stat-label">總發放授圈數</div><div class="stat-value" id="stat-total">0</div></div>
        <div class="stat-card"><div class="stat-label">作用中 (Active)</div><div class="stat-value green" id="stat-active">0</div></div>
        <div class="stat-card"><div class="stat-label">已綁定機器</div><div class="stat-value purple" id="stat-bound">0</div></div>
        <div class="stat-card"><div class="stat-label">客戶總數</div><div class="stat-value amber" id="stat-customers">0</div></div>
      </div>
      <div class="page-header"><div class="page-title">近期驗證日誌 (Validation Logs)</div></div>
      <div class="card">
        <div class="table-responsive">
          <table>
            <thead><tr><th>時間</th><th>授權金鑰</th><th>機器指紋</th><th>來源 IP</th><th>結果</th></tr></thead>
            <tbody id="log-table-body"><td colspan="5" class="empty">載入中...</td></tbody>
          </table>
        </div>
      </div>
    </div>

    <div id="view-licenses" class="view-panel">
      <div class="page-header">
        <div class="page-title">授權金鑰清單</div>
        <button class="btn" onclick="openCreateLicenseModal()">＋ 建立新授權</button>
      </div>
      <div class="card">
        <div class="table-responsive">
          <table>
            <thead><tr><th>客戶</th><th>授權金鑰 (Key)</th><th>狀態</th><th>到期日</th><th>已綁定機器指紋</th><th>操作</th></tr></thead>
            <tbody id="license-table-body"><td colspan="6" class="empty">載入中...</td></tbody>
          </table>
        </div>
      </div>
    </div>

    <div id="view-customers" class="view-panel">
      <div class="page-header">
        <div class="page-title">客戶管理</div>
        <button class="btn" onclick="openModal('modal-customer')">＋ 新增客戶</button>
      </div>
      <div class="card">
        <div class="table-responsive">
          <table>
            <thead><tr><th>客戶名稱</th><th>Email</th><th>備註</th><th>授權總數 / 作用中</th><th>建立時間</th><th>操作</th></tr></thead>
            <tbody id="customer-table-body"><td colspan="6" class="empty">載入中...</td></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="modal-customer" class="modal-overlay">
  <div class="modal">
    <div class="modal-header"><div class="modal-title">新增客戶資料</div><button class="modal-close" onclick="closeModal('modal-customer')">×</button></div>
    <form id="form-customer">
      <div class="modal-body">
        <div class="form-group"><label>客戶/公司名稱 *</label><input type="text" id="cust-name" class="form-control" required></div>
        <div class="form-group"><label>電子郵件</label><input type="email" id="cust-email" class="form-control"></div>
        <div class="form-group"><label>備註</label><textarea id="cust-note" class="form-control" rows="3"></textarea></div>
      </div>
      <div class="modal-footer"><button type="button" class="btn btn-secondary" onclick="closeModal('modal-customer')">取消</button><button type="submit" class="btn">儲存</button></div>
    </form>
  </div>
</div>

<div id="modal-license" class="modal-overlay">
  <div class="modal">
    <div class="modal-header"><div class="modal-title">發行新授權金鑰</div><button class="modal-close" onclick="closeModal('modal-license')">×</button></div>
    <form id="form-license">
      <div class="modal-body">
        <div class="form-group"><label>選擇所屬客戶 *</label><select id="lic-cust-id" class="form-control" required></select></div>
        <div class="form-group"><label>到期時間 *</label><input type="datetime-local" id="lic-expires" class="form-control" required></div>
        <div class="form-group"><label>備註條款</label><input type="text" id="lic-note" class="form-control" placeholder="如：合約編號、專案方案"></div>
      </div>
      <div class="modal-footer"><button type="button" class="btn btn-secondary" onclick="closeModal('modal-license')">取消</button><button type="submit" class="btn">生成金鑰</button></div>
    </form>
  </div>
</div>

<div id="modal-extend" class="modal-overlay">
  <div class="modal">
    <div class="modal-header"><div class="modal-title">延長授權效期</div><button class="modal-close" onclick="closeModal('modal-extend')">×</button></div>
    <form id="form-extend">
      <input type="hidden" id="extend-lic-id">
      <div class="modal-body">
        <div class="form-group"><label>目前授權金鑰</label><div class="code-block" style="color:var(--text)"><span id="extend-lic-key"></span></div></div>
        <div class="form-group"><label>調整全新到期時間 *</label><input type="datetime-local" id="extend-expires" class="form-control" required></div>
      </div>
      <div class="modal-footer"><button type="button" class="btn btn-secondary" onclick="closeModal('modal-extend')">取消</button><button type="submit" class="btn">更新時效</button></div>
    </form>
  </div>
</div>

<div id="modal-chpwd" class="modal-overlay">
  <div class="modal">
    <div class="modal-header"><div class="modal-title">修改管理員登入密碼</div><button class="modal-close" onclick="closeModal('modal-chpwd')">×</button></div>
    <form id="form-chpwd">
      <div class="modal-body">
        <div class="form-group"><label>目前的密碼 *</label><input type="password" id="pwd-current" class="form-control" required></div>
        <div class="form-group"><label>設定新密碼 * (至少 8 碼)</label><input type="password" id="pwd-new" class="form-control" required></div>
      </div>
      <div class="modal-footer"><button type="button" class="btn btn-secondary" onclick="closeModal('modal-chpwd')">取消</button><button type="submit" class="btn">變更密碼</button></div>
    </form>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
// ==============================================================================
// ⚙️ 核心雲端連線設定（請在此處填入你正確的 Supabase 資訊）
// ==============================================================================
const PROJECT_ID = "hacrjbofrqzljzysdheb"; // 👈 請替換成你真實的 Supabase Project ID
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhhY3JqYm9mcnF6bGp6eXNkaGViIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA3NDgxNjQsImV4cCI6MjA5NjMyNDE2NH0.1AJEAbVX6iadRbRtf00gHcgTIMIxaw_coBnrto9ZXdE"; // 👈 請替換成你真實的 anon public key

const FUNC_BASE = `https://${PROJECT_ID}.supabase.co/functions/v1`;

let token = localStorage.getItem('twinkle_admin_token') || '';

// ==============================================================================
// 🔒 統一封裝的 Fetch 請求函式（自動注入 apikey 解決 Kong 閘道阻擋問題）
// ==============================================================================
async function apiFetch(url, options = {}) {
    options.headers = options.headers || {};
    
    // 強制補上基礎安全驗證 apikey
    options.headers['apikey'] = SUPABASE_ANON_KEY;
    
    // 如果本地存有 JWT 登入 Token，則同步注入身份驗證
    if (token) {
        options.headers['Authorization'] = `Bearer ${token}`;
    }
    
    if (options.body && !options.headers['Content-Type']) {
        options.headers['Content-Type'] = 'application/json';
    }
    
    const response = await fetch(url, options);
    if (response.status === 401) {
        logout();
        toast('登入逾期或無效，請重新登入', 'danger');
        throw new Error('Unauthorized');
    }
    return response;
}

// 🌐 頁面切換機制
function switchView(viewName) {
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.view-panel').forEach(p => p.classList.remove('active'));
    event.target.classList.add('active');
    document.getElementById(`view-${viewName}`).classList.add('active');
    if(viewName==='dashboard') loadDashboard();
    if(viewName==='licenses') loadLicenses();
    if(viewName==='customers') loadCustomers();
}

// 🔓 登入邏輯
document.getElementById('login-form').addEventListener('submit', async e => {
    e.preventDefault();
    const email = document.getElementById('login-email').value;
    const password = document.getElementById('login-password').value;
    try {
        const res = await apiFetch(`${FUNC_BASE}/auth?action=login`, {
            method: 'POST',
            body: JSON.stringify({ email, password })
        });
        const data = await res.json();
        if(!res.ok) return toast(data.error || '登入失敗', 'danger');
        token = data.token;
        localStorage.setItem('twinkle_admin_token', token);
        document.getElementById('admin-email-display').textContent = data.email;
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('app').style.display = 'block';
        loadDashboard();
        toast('登入成功');
    } catch(err) { toast('無法連線到雲端 API 閘道', 'danger'); }
});

function logout() {
    token = ''; localStorage.removeItem('twinkle_admin_token');
    document.getElementById('app').style.display = 'none';
    document.getElementById('login-screen').style.display = 'flex';
}

// 📊 儀表板資料加載
async function loadDashboard() {
    try {
        const [resLic, resCust] = await Promise.all([
            apiFetch(`${FUNC_BASE}/licenses`),
            apiFetch(`${FUNC_BASE}/customers`)
        ]);
        if(!resLic.ok || !resCust.ok) return;
        const lic = await resLic.json(); const cust = await resCust.json();
        document.getElementById('stat-total').textContent = lic.length;
        document.getElementById('stat-active').textContent = lic.filter(l=>l.status==='active').length;
        document.getElementById('stat-bound').textContent = lic.filter(l=>l.activated_machine_id).length;
        document.getElementById('stat-customers').textContent = cust.length;
        
        let allLogs = [];
        for(let l of lic.slice(0, 8)) {
            const rLog = await apiFetch(`${FUNC_BASE}/licenses/${l.id}/logs`);
            if(rLog.ok) allLogs = allLogs.concat(await rLog.json());
        }
        allLogs.sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));
        const tbody = document.getElementById('log-table-body');
        tbody.innerHTML = allLogs.length ? allLogs.slice(0,15).map(g=>`
          <tr>
            <td>${new Date(g.created_at).toLocaleString()}</td>
            <td><span class="badge btn-secondary" style="font-family:monospace">${g.license_key}</span></td>
            <td style="font-family:monospace;color:var(--muted)">${g.machine_id||'--'}</td>
            <td>${g.ip}</td>
            <td><span class="badge ${g.result==='SUCCESS'?'badge-active':'badge-suspended'}">${g.result}</span></td>
          </tr>
        `).join('') : `<tr><td colspan="5" class="empty">目前沒有任何實體激活或驗證紀錄</td></tr>`;
    } catch{}
}

// 🔑 授權管理列表
async function loadLicenses() {
    const tbody = document.getElementById('license-table-body');
    try {
        const res = await apiFetch(`${FUNC_BASE}/licenses`);
        const data = await res.json();
        tbody.innerHTML = data.length ? data.map(l=>`
          <tr>
            <td><strong>${l.customers?.name||'未定義客戶'}</strong><div style="font-size:11px;color:var(--muted)">${l.customers?.email||''}</div></td>
            <td>
              <div class="code-block">${l.license_key}<button class="btn btn-secondary btn-sm" onclick="copyText('${l.license_key}')">複製</button></div>
              ${l.note?`<div style="font-size:11px;color:var(--muted);margin-top:4px">📝 ${l.note}</div>`:''}
            </td>
            <td><span class="badge ${l.status==='active'?'badge-active':'badge-suspended'}">${l.status==='active'?'作用中':'已停用'}</span></td>
            <td>${l.expires_at?new Date(l.expires_at).toLocaleString():'無限期'}</td>
            <td style="font-family:monospace;font-size:12px">${l.activated_machine_id?`🔒 ${l.activated_machine_id}`:`<span style="color:var(--muted)">☁️ 待綁定（首次執行自動鎖定）</span>`}</td>
            <td>
              <div class="flex-actions">
                <button class="btn btn-secondary btn-sm" onclick="openExtendModal('${l.id}','${l.license_key}','${l.expires_at}')">延期</button>
                <button class="btn btn-secondary btn-sm" ${!l.activated_machine_id?'disabled':''} onclick="unbindLicense('${l.id}')">解綁機器</button>
                <button class="btn ${l.status==='active'?'btn-danger':'btn-secondary'} btn-sm" onclick="toggleLicenseStatus('${l.id}','${l.status}')">${l.status==='active'?'停用':'啟用'}</button>
              </div>
            </td>
          </tr>
        `).join('') : `<tr><td colspan="6" class="empty">尚未發行任何授權金鑰</td></tr>`;
    } catch { tbody.innerHTML=`<tr><td colspan="6" class="empty" style="color:var(--red)">無法連接到雲端服務，請確認 Project ID 與 Anon Key 是否正確。</td></tr>`; }
}

// 👥 客戶管理列表
async function loadCustomers() {
    const tbody = document.getElementById('customer-table-body');
    try {
        const res = await apiFetch(`${FUNC_BASE}/customers`);
        const data = await res.json();
        tbody.innerHTML = data.length ? data.map(c=>`
          <tr>
            <td><strong>${c.name}</strong></td>
            <td>${c.email||'--'}</td>
            <td style="color:var(--muted)">${c.note||'--'}</td>
            <td>共發行 ${c.license_count||0} 組 / 使用中 ${c.active_license_count||0} 組</td>
            <td>${new Date(c.created_at).toLocaleDateString()}</td>
            <td><button class="btn btn-danger btn-sm" onclick="deleteCustomer('${c.id}')">刪除</button></td>
          </tr>
        `).join('') : `<tr><td colspan="6" class="empty">目前沒有客戶資料</td></tr>`;
    } catch {}
}

// ➕ 動作：新增客戶
document.getElementById('form-customer').addEventListener('submit', async e => {
    e.preventDefault();
    const name = document.getElementById('cust-name').value;
    const email = document.getElementById('cust-email').value;
    const note = document.getElementById('cust-note').value;
    const res = await apiFetch(`${FUNC_BASE}/customers`, {
        method: 'POST',
        body: JSON.stringify({ name, email, note })
    });
    if(res.ok) { closeModal('modal-customer'); document.getElementById('form-customer').reset(); loadCustomers(); toast('客戶新增成功'); }
});

// ➕ 動作：彈出授權建立視窗並加載客戶選單
async function openCreateLicenseModal() {
    const select = document.getElementById('lic-cust-id');
    select.innerHTML = '<option>載入中...</option>';
    openModal('modal-license');
    const res = await apiFetch(`${FUNC_BASE}/customers`);
    const data = await res.json();
    select.innerHTML = data.map(c=>`<option value="${c.id}">${c.name}</option>`).join('');
    
    // 預設填入一年後的時間
    const yearLater = new Date(); yearLater.setFullYear(yearLater.getFullYear() + 1);
    document.getElementById('lic-expires').value = yearLater.toISOString().slice(0,16);
}

document.getElementById('form-license').addEventListener('submit', async e => {
    e.preventDefault();
    const customer_id = document.getElementById('lic-cust-id').value;
    const expires_at = new Date(document.getElementById('lic-expires').value).toISOString();
    const note = document.getElementById('lic-note').value;
    const res = await apiFetch(`${FUNC_BASE}/licenses`, {
        method: 'POST',
        body: JSON.stringify({ customer_id, expires_at, note })
    });
    if(res.ok) { closeModal('modal-license'); loadLicenses(); toast('全新授權碼發行成功！'); }
});

// 🔄 動作：切換開關狀態 (Active/Suspended)
async function toggleLicenseStatus(id, currentStatus) {
    const nextStatus = currentStatus === 'active' ? 'suspended' : 'active';
    const res = await apiFetch(`${FUNC_BASE}/licenses/${id}/status`, {
        method: 'PATCH',
        body: JSON.stringify({ status: nextStatus })
    });
    if(res.ok) { loadLicenses(); toast(`已成功將授權設定為【${nextStatus==='active'?'啟用':'停用'}】`); }
}

// 🔓 動作：解除硬體指紋鎖定
async function unbindLicense(id) {
    if(!confirm('確定要解除此授權與客戶電腦的實體硬體綁定嗎？解除後，首台執行的機器將會重新自動註冊。')) return;
    const res = await apiFetch(`${FUNC_BASE}/licenses/${id}/unbind`, { method: 'PATCH' });
    if(res.ok) { loadLicenses(); toast('機器指紋解綁成功！欄位已清空'); }
}

// ⏳ 動作：延長效期
function openExtendModal(id, key, currentExpires) {
    document.getElementById('extend-lic-id').value = id;
    document.getElementById('extend-lic-key').textContent = key;
    if(currentExpires) {
        document.getElementById('extend-expires').value = new Date(currentExpires).toISOString().slice(0,16);
    }
    openModal('modal-extend');
}
document.getElementById('form-extend').addEventListener('submit', async e => {
    e.preventDefault();
    const id = document.getElementById('extend-lic-id').value;
    const expires_at = new Date(document.getElementById('extend-expires').value).toISOString();
    const res = await apiFetch(`${FUNC_BASE}/licenses/${id}/extend`, {
        method: 'PATCH',
        body: JSON.stringify({ expires_at })
    });
    if(res.ok) { closeModal('modal-extend'); loadLicenses(); toast('授權效期更新完畢！'); }
});

// ❌ 動作：刪除客戶
async function deleteCustomer(id) {
    if(!confirm('警告：刪除客戶將會連帶「刪除該客戶名下所有發行的授權金鑰」，此動作無法復原！確定要刪除？')) return;
    const res = await apiFetch(`${FUNC_BASE}/customers/${id}`, { method: 'DELETE' });
    if(res.ok) { loadCustomers(); toast('客戶及其名下授權已安全移除'); }
}

// 🔑 動作：修改管理員密碼
document.getElementById('form-chpwd').addEventListener('submit', async e => {
    e.preventDefault();
    const current_password = document.getElementById('pwd-current').value;
    const new_password = document.getElementById('pwd-new').value;
    const res = await apiFetch(`${FUNC_BASE}/auth?action=change-password`, {
        method: 'POST',
        body: JSON.stringify({ current_password, new_password })
    });
    const data = await res.json();
    if(!res.ok) return toast(data.error || '變更失敗', 'danger');
    closeModal('modal-chpwd'); document.getElementById('form-chpwd').reset();
    toast('管理員密碼修改成功');
});

// 彈窗基礎組件
function openModal(id) { document.getElementById(id).classList.add('show'); }
function closeModal(id) { document.getElementById(id).classList.remove('show'); }
function copyText(text) {
    if (navigator.clipboard?.writeText) {
        navigator.clipboard.writeText(text).then(() => toast('已複製授權碼', 'success'));
    } else {
        const el = Object.assign(document.createElement('textarea'), { value: text, style: 'position:fixed;opacity:0' });
        document.body.appendChild(el); el.select(); document.execCommand('copy');
        document.body.removeChild(el); toast('已複製授權碼', 'success');
    }
}
let toastTimer;
function toast(msg, type = 'success') {
    const el = document.getElementById('toast');
    el.textContent = msg; el.className = `toast ${type} show`;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 2800);
}
document.querySelectorAll('.modal-overlay').forEach(o => {
    o.addEventListener('click', e => { if (e.target === o) o.classList.remove('show'); });
});

// 🔄 網頁載入自動檢查登入
(async function autoLogin() {
    if (!token) return;
    try {
        const res = await apiFetch(`${FUNC_BASE}/auth?action=me`);
        if (res.ok) {
            const data = await res.json();
            document.getElementById('admin-email-display').textContent = data.email;
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('app').style.display = 'block';
            loadDashboard();
        } else { logout(); }
    } catch { logout(); }
})();
</script>
